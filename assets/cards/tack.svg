<svg xmlns="http://www.w3.org/2000/svg" width="412" height="278" viewBox="0 0 412 278" role="img" aria-label="Tack: a quick alternative to Notes. A macOS menu bar app for checklists, reminders, tags and Markdown. Open source.">
<title>Tack: a quick alternative to Notes. A macOS menu bar app for checklists, reminders, tags and Markdown. Open source.</title>
<style>
  .bg { fill: #ffffff; }
  .bd { stroke: #d0d7de; }
  .fg { fill: #1f2328; }
  .mu { fill: #59636e; }
  .chip { fill: #f6f8fa; stroke: #d0d7de; }
  .ink { fill: #1f2328; }
  .tile { fill: #f6f8fa; stroke: #d8dee4; }
  .soft { fill: #eef1f5; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .bd { stroke: #30363d; }
    .fg { fill: #e6edf3; }
    .mu { fill: #9198a1; }
    .chip { fill: #161b22; stroke: #30363d; }
    .ink { fill: #e6edf3; }
    .tile { fill: #161b22; stroke: #262c36; }
    .soft { fill: #1b2230; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

  @keyframes float { 0%, 100% { transform: translateY(0) rotate(4deg); } 50% { transform: translateY(-5px) rotate(4deg); } }
  .note { transform-box: fill-box; transform-origin: center; transform: rotate(4deg); animation: float 5s ease-in-out infinite; }
  @keyframes tick { 0%, 30% { stroke-dashoffset: 12; } 45%, 100% { stroke-dashoffset: 0; } }
  .tick { stroke-dasharray: 12; animation: tick 5s ease-out infinite; }
</style>
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1">
    <stop offset="0" stop-color="#ff9f0a" stop-opacity="0.20"/>
    <stop offset="0.55" stop-color="#ff9f0a" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clip"><rect x="0.5" y="0.5" width="411" height="277" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="412" height="278" class="bg"/>
  <rect width="412" height="278" fill="url(#glow)"/>
  <rect x="0" y="0" width="412" height="3" fill="#ff9f0a" fill-opacity="0.9"/>
</g>
<rect x="0.5" y="0.5" width="411" height="277" rx="18" fill="none" class="bd"/>
<image href="data:image/png;base64," x="22" y="22" width="60" height="60"/>
<text x="94" y="46" font-size="11" font-weight="700" letter-spacing="1.5" class="mu">MACOS APP</text>
<text x="93" y="76" font-size="26" font-weight="800" letter-spacing="-0.5" class="fg">Tack</text>
<text x="26" y="118" font-size="16" font-weight="600" class="fg">A quick alternative to Notes.</text>
<text x="26" y="146" font-size="14" class="mu">Pin a thought from the macOS menu bar with</text>
<text x="26" y="167" font-size="14" class="mu">one shortcut, even over full-screen apps.</text>
<text x="26" y="188" font-size="14" class="mu">Checklists, reminders, tags and Markdown.</text>
<rect x="26" y="222" width="53" height="24" rx="12.0" class="chip"/>
<text x="52.4" y="238.3" text-anchor="middle" font-size="12" font-weight="600" class="mu">Swift</text>
<rect x="86.78240000000001" y="222" width="65" height="24" rx="12.0" class="chip"/>
<text x="119.3" y="238.3" text-anchor="middle" font-size="12" font-weight="600" class="mu">SwiftUI</text>
<rect x="159.776" y="222" width="45" height="24" rx="12.0" class="chip"/>
<text x="182.4" y="238.3" text-anchor="middle" font-size="12" font-weight="600" class="mu">MIT</text>
<rect x="212.9264" y="222" width="95" height="24" rx="12.0" class="chip"/>
<text x="260.6" y="238.3" text-anchor="middle" font-size="12" font-weight="600" class="mu">No telemetry</text>
<g transform="translate(316 24)"><g class="note">
  <rect width="70" height="64" rx="9" fill="#ffb340" fill-opacity="0.16" stroke="#ff9f0a" stroke-opacity="0.55"/>
  <rect x="10" y="12" width="9" height="9" rx="2.5" fill="#ff9f0a"/><path class="tick" d="M12 16.6l2 2 3.5-4" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="24" y="14" width="34" height="5" rx="2.5" fill="#ff9f0a" fill-opacity="0.55"/>
  <rect x="10" y="28" width="9" height="9" rx="2.5" fill="none" stroke="#ff9f0a" stroke-width="1.4"/><rect x="24" y="30" width="28" height="5" rx="2.5" fill="#ff9f0a" fill-opacity="0.35"/>
  <rect x="10" y="44" width="9" height="9" rx="2.5" fill="none" stroke="#ff9f0a" stroke-width="1.4"/><rect x="24" y="46" width="36" height="5" rx="2.5" fill="#ff9f0a" fill-opacity="0.35"/>
</g></g>
</svg>
