<svg xmlns="http://www.w3.org/2000/svg" width="412" height="278" viewBox="0 0 412 278" role="img" aria-label="Nebula: a free, open-source alternative to GitKraken. A fast Git client for macOS, Windows and Linux.">
<title>Nebula: a free, open-source alternative to GitKraken. A fast Git client for macOS, Windows and Linux.</title>
<style>
  .bg { fill: #ffffff; }
  .bd { stroke: #d0d7de; }
  .fg { fill: #1f2328; }
  .mu { fill: #59636e; }
  .chip { fill: #f6f8fa; stroke: #d0d7de; }
  .ink { fill: #1f2328; }
  .tile { fill: #f6f8fa; stroke: #d8dee4; }
  .soft { fill: #eef1f5; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .bd { stroke: #30363d; }
    .fg { fill: #e6edf3; }
    .mu { fill: #9198a1; }
    .chip { fill: #161b22; stroke: #30363d; }
    .ink { fill: #e6edf3; }
    .tile { fill: #161b22; stroke: #262c36; }
    .soft { fill: #1b2230; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

  @keyframes pulse { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .p { animation: pulse 2.4s ease-in-out infinite; }
  @keyframes draw { 0% { stroke-dashoffset: 120; } 40%, 100% { stroke-dashoffset: 0; } }
  .branch { stroke-dasharray: 120; animation: draw 4s ease-out infinite; }
</style>
<defs>
  <radialGradient id="glow" cx="1" cy="0" r="1">
    <stop offset="0" stop-color="#a855f7" stop-opacity="0.20"/>
    <stop offset="0.55" stop-color="#a855f7" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="clip"><rect x="0.5" y="0.5" width="411" height="277" rx="18"/></clipPath>
</defs>
<g clip-path="url(#clip)">
  <rect width="412" height="278" class="bg"/>
  <rect width="412" height="278" fill="url(#glow)"/>
  <rect x="0" y="0" width="412" height="3" fill="#a855f7" fill-opacity="0.9"/>
</g>
<rect x="0.5" y="0.5" width="411" height="277" rx="18" fill="none" class="bd"/>
<g transform="translate(22 22)">
  <defs><linearGradient id="neb" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7c3aed"/><stop offset="1" stop-color="#db2777"/></linearGradient></defs>
  <rect width="60" height="60" rx="15" fill="url(#neb)"/>
  <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round"><path d="M22 14v32"/><path d="M22 36c0-10 16-6 16-16"/></g>
  <circle cx="22" cy="14" r="4.5" fill="#fff"/><circle cx="22" cy="46" r="4.5" fill="#fff"/><circle cx="38" cy="18" r="4.5" fill="#fff"/>
</g>
<text x="94" y="46" font-size="11" font-weight="700" letter-spacing="1.5" class="mu">GIT CLIENT</text>
<text x="93" y="76" font-size="26" font-weight="800" letter-spacing="-0.5" class="fg">Nebula</text>
<text x="26" y="118" font-size="16" font-weight="600" class="fg">A free alternative to GitKraken.</text>
<text x="26" y="146" font-size="14" class="mu">A fast Git client for macOS, Windows and</text>
<text x="26" y="167" font-size="14" class="mu">Linux: commit graph, merge conflicts, pull</text>
<text x="26" y="188" font-size="14" class="mu">requests, issues and an integrated terminal.</text>
<rect x="26" y="222" width="70" height="24" rx="12.0" class="chip"/>
<text x="60.9" y="238.3" text-anchor="middle" font-size="12" font-weight="600" class="mu">Electron</text>
<rect x="103.8272" y="222" width="131" height="24" rx="12.0" class="chip"/>
<text x="169.4" y="238.3" text-anchor="middle" font-size="12" font-weight="600" class="mu">Mac · Win · Linux</text>
<rect x="242.96479999999997" y="222" width="45" height="24" rx="12.0" class="chip"/>
<text x="265.5" y="238.3" text-anchor="middle" font-size="12" font-weight="600" class="mu">MIT</text>
<g transform="translate(322 22)" fill="none" stroke-width="2.4" stroke-linecap="round">
  <path d="M12 0V66" stroke="#a78bfa"/>
  <path class="branch" d="M12 12c0 14 24 8 24 24v30" stroke="#f472b6"/>
  <path class="branch" d="M36 30c0 12 24 6 24 22" stroke="#c084fc" style="animation-delay:-1.3s"/>
  <g stroke="none">
    <circle cx="12" cy="8" r="5" fill="#a78bfa" class="p"/>
    <circle cx="12" cy="40" r="5" fill="#a78bfa" class="p" style="animation-delay:-.6s"/>
    <circle cx="36" cy="38" r="5" fill="#f472b6" class="p" style="animation-delay:-1.2s"/>
    <circle cx="60" cy="54" r="5" fill="#c084fc" class="p" style="animation-delay:-1.8s"/>
  </g>
</g>
</svg>
