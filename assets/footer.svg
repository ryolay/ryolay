<svg xmlns="http://www.w3.org/2000/svg" width="840" height="110" viewBox="0 0 840 110" role="img" aria-label="Thanks for stopping by. Geneva, Switzerland.">
<title>Thanks for stopping by. Geneva, Switzerland.</title>
<style>
  .bg { fill: #ffffff; }
  .bd { stroke: #d0d7de; }
  .fg { fill: #1f2328; }
  .mu { fill: #59636e; }
  .chip { fill: #f6f8fa; stroke: #d0d7de; }
  .ink { fill: #1f2328; }
  .tile { fill: #f6f8fa; stroke: #d8dee4; }
  .soft { fill: #eef1f5; }
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #0d1117; }
    .bd { stroke: #30363d; }
    .fg { fill: #e6edf3; }
    .mu { fill: #9198a1; }
    .chip { fill: #161b22; stroke: #30363d; }
    .ink { fill: #e6edf3; }
    .tile { fill: #161b22; stroke: #262c36; }
    .soft { fill: #1b2230; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; }
  }

  @keyframes shine { 0% { transform: translateX(-160px); } 100% { transform: translateX(160px); } }
  .shine { animation: shine 2.8s ease-in-out infinite alternate; }
</style>
<defs>
  <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff5a4e" stop-opacity="0"/><stop offset="0.5" stop-color="#ff5a4e"/><stop offset="1" stop-color="#ff2d6f" stop-opacity="0"/></linearGradient>
  <clipPath id="bar"><rect x="300" y="14" width="240" height="3" rx="1.5"/></clipPath>
</defs>
<rect x="300" y="14" width="240" height="3" rx="1.5" class="soft"/>
<g clip-path="url(#bar)"><rect class="shine" x="340" y="14" width="160" height="3" fill="url(#acc)"/></g>
<text x="420.0" y="58" text-anchor="middle" font-size="19" font-weight="700" class="fg">Thanks for stopping by.</text>
<g transform="translate(342.0 74)">
  <rect width="16" height="16" rx="3.5" fill="#da291c"/><rect x="6.6" y="3" width="2.8" height="10" fill="#fff"/><rect x="3" y="6.6" width="10" height="2.8" fill="#fff"/>
</g>
<text x="432.0" y="87" text-anchor="middle" font-size="13.5" class="mu">Geneva, Switzerland</text>
</svg>
